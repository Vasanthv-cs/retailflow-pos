spring:
  datasource:
    url: jdbc:h2:mem:retailflow_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

retailflow:
  jwt:
    secret: TestOnlyJwtSecretKeyForAutomatedCiSuiteAtLeast32Bytes!
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
