server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: retailflow-backend-prod

  datasource:
    # Supports Railway MySQL automatically (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD or MYSQL_URL)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:${DB_HOST:localhost}}:${MYSQLPORT:${DB_PORT:3306}}/${MYSQLDATABASE:${DB_NAME:railway}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}
    username: ${MYSQLUSER:${DB_USERNAME:root}}
    password: ${MYSQLPASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: RetailFlowProductionPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 50
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

retailflow:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    # Comma-separated list of allowed frontend origins (e.g. Vercel production and preview domains)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://retailflow-pos.vercel.app,https://retailflow.vercel.app}
  admin:
    initial-name: ${INITIAL_ADMIN_NAME:Store Administrator}
    initial-email: ${INITIAL_ADMIN_EMAIL:admin@retailflow.in}
    initial-password: ${INITIAL_ADMIN_PASSWORD:Admin@Secure2026!}
    initial-code: ${INITIAL_ADMIN_CODE:ADMIN-001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.retailflow: INFO
    org.springframework.security: WARN
    org.hibernate: ERROR
